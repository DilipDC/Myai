<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — BUILT BY DILIP</title>
<style>
:root{--bg:#04070a;--panel:#091017;--line:#18303d;--cyan:#00e5ff;--green:#61ff9a;--text:#e9f7fb;--muted:#78909c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#09202a 0,#04070a 42%);color:var(--text);font:13px system-ui,sans-serif;height:100vh;overflow:hidden}
.shell{height:100vh;display:grid;grid-template-columns:240px 1fr 250px;grid-template-rows:70px 1fr 62px;max-width:1500px;margin:auto;border-inline:1px solid var(--line)}
header{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{font-size:20px;font-weight:900;letter-spacing:4px}.built{color:var(--cyan);font-size:10px;letter-spacing:2px}.online{color:var(--green);font-weight:700}
aside{padding:15px;border-right:1px solid var(--line);overflow:auto}.right{border-left:1px solid var(--line);border-right:0}
h3{font-size:10px;color:var(--muted);letter-spacing:2px;margin:12px 0}.metric{padding:10px;border:1px solid var(--line);background:#071018;border-radius:9px;margin-bottom:8px}.value{font-size:18px;color:var(--cyan)}
#chat{overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px}.msg{max-width:80%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#0c1b28}.ai{background:var(--panel)}
#composer{grid-column:1/-1;border-top:1px solid var(--line);display:flex;gap:8px;padding:9px 12px}textarea{flex:1;background:#050a0e;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;resize:none}button{background:#071c25;color:var(--cyan);border:1px solid #195568;border-radius:9px;padding:0 14px;cursor:pointer}button:hover{background:#0a2934}
.list{font-size:11px;color:var(--muted);line-height:1.6}.task{border-bottom:1px solid var(--line);padding:7px 0}
@media(max-width:900px){.shell{grid-template-columns:1fr;grid-template-rows:65px 1fr 62px}.left,.right{display:none}}
</style>
</head>
<body>
<div class="shell">
<header><div><div class="brand">JARVIS</div><div class="built">BUILT BY DILIP</div></div><div id="online" class="online">CONNECTING…</div></header>
<aside class="left"><h3>SYSTEM</h3><div class="metric">CPU<div id="cpu" class="value">—</div></div><div class="metric">RAM<div id="ram" class="value">—</div></div><div class="metric">MODEL<div id="model" class="value" style="font-size:12px">—</div></div><h3>MEMORY</h3><div id="memory" class="list">—</div></aside>
<section id="chat"></section>
<aside class="right"><h3>TASKS</h3><div id="tasks" class="list">—</div><h3>NETWORK</h3><div id="network" class="list">—</div><h3>VOICE</h3><button id="mic">MIC</button> <button id="speak">TTS</button></aside>
<form id="composer"><textarea id="input" rows="1" placeholder="Command JARVIS…"></textarea><button>SEND</button></form>
</div>
<script>
const $=id=>document.getElementById(id),chat=$("chat"),input=$("input");
function add(text,who){let x=document.createElement("div");x.className="msg "+who;x.textContent=text;chat.append(x);chat.scrollTop=chat.scrollHeight}
async function status(){
 try{let s=await (await fetch("/status")).json();$("online").textContent=s.ollama.ok?"● ONLINE":"● OLLAMA OFFLINE";$("cpu").textContent=s.system.cpu_percent+"%";$("ram").textContent=s.system.ram_used_mb+" MB / "+s.system.ram_percent+"%";$("model").textContent=s.model.active||"IDLE";$("memory").textContent=s.memory_count+" stored memories";$("tasks").innerHTML=s.tasks.length?s.tasks.map(t=>"<div class='task'>"+t.text+"<br>"+t.run_at+"</div>").join(""):"No active tasks";}catch{}}
async function sys(){try{let s=await (await fetch("/system")).json();$("network").textContent=s.network.map(n=>n.name).join("\n")||"offline"}catch{}}
async function send(text){if(!text)return;add(text,"user");add("Thinking…","ai");let pending=chat.lastElementChild;try{let d=await (await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})})).json();pending.textContent=d.reply||d.error||"No response."}catch(e){pending.textContent="JARVIS ERROR: "+e.message}status()}
$("composer").onsubmit=e=>{e.preventDefault();let t=input.value.trim();input.value="";send(t)};
input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}};
$("speak").onclick=()=>{let last=[...document.querySelectorAll(".msg.ai")].pop();if(last&&"speechSynthesis"in window)speechSynthesis.speak(new SpeechSynthesisUtterance(last.textContent))};
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add("Browser speech recognition is unavailable; text input remains available.","ai");return}let r=new SR();r.lang=navigator.language||"en-US";r.onresult=e=>send(e.results[0][0].transcript);r.start()};
add("JARVIS ONLINE. Local-first command center ready.","ai");status();sys();setInterval(status,4000);setInterval(sys,10000);
</script>
</body>
</html>
