<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Built by Dilip</title>
<style>
:root{--bg:#05070b;--panel:#0c1119;--line:#1b2a38;--accent:#00e5ff;--text:#e8f1f5;--muted:#81909a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;overflow:hidden}
main{width:100%;max-width:1100px;margin:auto;height:100vh;display:flex;flex-direction:column;border-inline:1px solid var(--line);background:linear-gradient(180deg,#081018,#05070b)}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.brand{font-weight:800;letter-spacing:2px}.sub{font-size:11px;color:var(--accent);margin-top:3px}
.status{color:#6dff9b;font-size:12px}
#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;white-space:pre-wrap;line-height:1.5}
.user{align-self:flex-end;background:#101b29;border-color:#234157}.ai{align-self:flex-start;background:var(--panel)}
.meta{font-size:10px;color:var(--muted);margin-bottom:5px}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;min-height:44px;max-height:140px;background:#070b10;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
button{border:1px solid #195367;background:#071a22;color:var(--accent);border-radius:10px;padding:0 18px;cursor:pointer}
button:hover{background:#0c2b36}
#statusbar{display:flex;gap:14px;padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:650px){.msg{max-width:94%}button{padding:0 12px}}
</style>
</head>
<body>
<main>
<header>
  <div><div class="brand">JARVIS</div><div class="sub">BUILT BY DILIP</div></div>
  <div id="online" class="status">CHECKING…</div>
</header>
<section id="chat"></section>
<div id="statusbar">
  <span id="model">Model: —</span>
  <span id="ram">RAM: —</span>
  <span id="cpu">CPU: —</span>
</div>
<form id="composer">
  <textarea id="input" placeholder="Type a command…"></textarea>
  <button>Send</button>
</form>
</main>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("input");
function add(text,who){
  const wrap=document.createElement("div"); wrap.className="msg "+who;
  const meta=document.createElement("div"); meta.className="meta"; meta.textContent=who==="ai"?"JARVIS":"YOU";
  const body=document.createElement("div"); body.textContent=text;
  wrap.append(meta,body); chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
}
async function load(){
  try{
    const r=await fetch("/history"); const rows=await r.json();
    rows.reverse().forEach(x=>{add(x.user_message,"user");add(x.ai_response,"ai")});
  }catch{}
  await refreshStatus();
}
async function refreshStatus(){
  try{
    const r=await fetch("/status"); const s=await r.json();
    document.getElementById("online").textContent=s.ollama.ok?"JARVIS ONLINE":"OLLAMA OFFLINE";
    document.getElementById("model").textContent="Model: "+(s.model.active||"—");
    document.getElementById("ram").textContent="RAM: "+s.system.ram_percent+"%";
    document.getElementById("cpu").textContent="CPU: "+s.system.cpu_percent+"%";
  }catch{}
}
document.getElementById("composer").addEventListener("submit",async e=>{
  e.preventDefault(); const text=input.value.trim(); if(!text)return;
  add(text,"user"); input.value="";
  add("Thinking…","ai"); const pending=chat.lastElementChild.lastElementChild;
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
    const d=await r.json(); pending.textContent=d.reply||d.error||"No response.";
  }catch(err){pending.textContent="JARVIS ERROR: "+err.message}
  refreshStatus();
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("composer").requestSubmit()}});
add("Phase 1 online. Local-first mode is ready when Ollama is running.","ai");
load();
setInterval(refreshStatus,5000);
</script>
</body>
</html>
